<!doctype html>
<html>
<head><meta charset="utf-8"><title>Senior Analyst - Example Co</title></head>
<body>
<h1>Senior Analyst</h1>
<p>Example Co is hiring a Senior Analyst to own reporting for our customer success team. You have 3+ years of SQL and dashboarding experience.</p>

<form id="application">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email *</label><input id="email" type="email" name="email" required>
  <div class="field"><div class="label">Phone</div><input type="tel" name="phone"></div>
  <label>LinkedIn Profile <input name="urls[LinkedIn]"></label>

  <label for="resume">Resume/CV *</label><input id="resume" type="file" name="resume">
  <label for="cl">Cover Letter</label><input id="cl" type="file" name="cover_letter">

  <fieldset>
    <legend>Will you now or in the future require sponsorship for employment visa status?</legend>
    <label><input type="radio" name="sponsor" value="1"> Yes</label>
    <label><input type="radio" name="sponsor" value="0"> No</label>
  </fieldset>

  <label for="auth">Are you legally authorized to work in the United States?</label>
  <select id="auth" name="auth">
    <option value="">Select...</option>
    <option>Yes</option>
    <option>No</option>
  </select>

  <label for="gender">Gender</label>
  <select id="gender" name="gender">
    <option value="">Please select</option>
    <option>Male</option><option>Female</option><option>Decline To Self Identify</option>
  </select>

  <label for="why">Why are you interested in this role?</label>
  <textarea id="why" name="why"></textarea>

  <label for="sql">How many years of SQL experience do you have?</label>
  <input id="sql" name="sql_years">

  <label><input type="checkbox" name="privacy"> I acknowledge the privacy policy</label>

  <button type="submit">Submit Application</button>
</form>
</body>
</html>
